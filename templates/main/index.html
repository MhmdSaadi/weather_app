
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Weather App</title>
  <!-- Latest compiled and minified CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

  <!-- Latest compiled JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f0f8ff;
      font-family: 'Arial', sans-serif;
    }
    nav {
      background: linear-gradient(to right, #4CAF50, #8BC34A);
      color: white;
      padding: 15px;
    }
    .container {
      margin-top: 50px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .result {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h3, h5 {
      margin: 10px 0;
    }
  </style>

</head>

<body>
  <nav class="row">
    <h1 class="col-md-3 text-center">Weather</h1>
  </nav>
  <div class="container text-center">
    <form method="post" class="col-md-6 col-md-offset-3">
      {% csrf_token %}
      <div class="input-group">
        <input type="text" class="form-control" name="city" placeholder="Enter city name">
        <div class="input-group-btn">
          <button class="btn btn-default" type="submit">
            <i class="glyphicon glyphicon-search"></i>
          </button>
        </div>
      </div>
    </form>
    <div class="row">
      {% if country_code and coordinate and temp and pressure and humidity %}
      <div class="col-md-6 col-md-offset-3 result">
        <h3>Country Code: {{country_code}}</h3>
        <h5>Coordinate: {{coordinate}}</h5>
        <h5>Temperature: {{temp}}</h5>
        <h5>Pressure: {{pressure}}</h5>
        <h5>Humidity: {{humidity}}</h5>
      </div>
      {% endif %}
    </div>
  </div>
</body>

</html>
