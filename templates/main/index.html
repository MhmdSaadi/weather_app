<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Weather App</title>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <!-- jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Custom CSS -->
    <style>
      body {
        background-color: #e0f7fa;
        font-family: 'Arial', sans-serif;
      }

      nav {
        background: linear-gradient(to right, #2196F3, #03A9F4);
        color: white;
        padding: 15px;
      }

      .container {
        margin-top: 50px;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .result {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h3,
      h5 {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-inverse">
      <div class="container-fluid">
        <div class="navbar-header">
          <a class="navbar-brand" href="#">
            <i class="fa fa-cloud"></i> Weather App </a>
        </div>
      </div>
    </nav>
    <div class="container">
      <form method="post" class="col-md-6 col-md-offset-3"> {% csrf_token %} <div class="input-group">
          <input type="text" class="form-control" name="city" placeholder="Enter city name">
          <div class="input-group-btn">
            <button class="btn btn-default" type="submit">
              <i class="glyphicon glyphicon-search"></i>
            </button>
          </div>
        </div>
      </form>
      <div class="row"> {% if country_code and coordinate and temp and pressure and humidity %} <div class="col-md-6 col-md-offset-3 result">
          <h3>
            <i class="glyphicon glyphicon-map-marker"></i> Coordinate: {{coordinate}}
          </h3>
          <h5>
            <i class="glyphicon glyphicon-thermometer"></i> Temperature: {{temp}}
          </h5>
          <h5>
            <i class="glyphicon glyphicon-dashboard"></i> Pressure: {{pressure}}
          </h5>
          <h5>
            <i class="glyphicon glyphicon-tint"></i> Humidity: {{humidity}}
          </h5>
        </div> {% endif %} </div>
    </div>
  </body>
</html>
